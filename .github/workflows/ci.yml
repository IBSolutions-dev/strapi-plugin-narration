name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Audit (production deps must be 0 vulnerabilities)
        run: npm run audit:prod

      - name: Audit (full tree, dev-only allowlist enforced)
        run: npm run audit:full

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Verify plugin output (strapi-plugin verify)
        run: npm run verify

      - name: Pack tarball
        run: npm pack --silent

      - name: Verify npm pack contents
        run: python3 scripts/verify-npm-pack.py
